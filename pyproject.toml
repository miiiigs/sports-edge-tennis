[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-edge-tennis"
version = "0.1.0"
description = "Independent men's tennis probability and pricing platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "openpyxl>=3.1",
    "psycopg[binary]>=3.2",
    "xlrd>=2.0",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "uvicorn>=0.29",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sports_edge_tennis.dashboard" = [
    "static/*",
    "templates/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_production_lock: exercise the real PostgreSQL advisory production lock",
]
